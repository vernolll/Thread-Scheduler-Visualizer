name: C++ CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-matrix:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-22.04
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          ${{ matrix.compiler == 'clang' && 'clang' || 'g++' }} \
          qtbase5-dev \
          qtdeclarative5-dev \
          libqt5svg5-dev \
          qml-module-qtquick2 \
          qml-module-qtquick-controls \
          qml-module-qtquick-controls2 \
          qml-module-qtquick-layouts \
          qml-module-qtquick-window2 \
          qml-module-qtquick-dialogs

    - name: Set up Qt (Windows)
      if: runner.os == 'Windows'
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        arch: 'win64_msvc2019_64'

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -G Ninja

    - name: Configure CMake (Windows MSVC)
      if: runner.os == 'Windows'
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"

    - name: Build Project
      run: cmake --build build --config Debug

    - name: Run Core Unit Tests
      run: ctest --test-dir build --output-on-failure

    - name: Run GUI Sanity Check (Offscreen - Linux Only)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        QT_QUICK_BACKEND: software
        LIBGL_ALWAYS_SOFTWARE: "1"
      run: |
        ./build/thread_scheduler_visualizer &
        APP_PID=$!
        sleep 3
        if kill -0 $APP_PID 2>/dev/null; then
          echo "GUI application initialized successfully!"
          kill $APP_PID
        else
          echo "GUI application crashed on startup!"
          exit 1
        fi

  release-and-smoke-test:
    needs: [build-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Qt (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          qtbase5-dev \
          qtdeclarative5-dev \
          libqt5svg5-dev

    - name: Set up Qt (Windows)
      if: runner.os == 'Windows'
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        arch: 'win64_msvc2019_64'

    - name: Configure CMake (Release Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -B build-release -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=OFF \
          -G Ninja

    - name: Configure CMake (Release Windows)
      if: runner.os == 'Windows'
      run: cmake -B build-release -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"

    - name: Build Project (Release)
      run: cmake --build build-release --config Release

    - name: Package Binaries (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $windeployqtCmd = Get-Command windeployqt -ErrorAction SilentlyContinue
        if ($windeployqtCmd) {
            $windeployqt = $windeployqtCmd.Source
        } elseif ($env:Qt5_DIR) {
            $base = Split-Path (Split-Path (Split-Path $env:Qt5_DIR -Parent) -Parent) -Parent
            $windeployqt = Join-Path $base "bin\windeployqt.exe"
        }
        
        if (-not $windeployqt -or -not (Test-Path $windeployqt)) {
            throw "windeployqt.exe could not be found!"
        }
        Write-Host "Using windeployqt at: $windeployqt"
        
        New-Item -ItemType Directory -Force -Path "release_dist"
        Copy-Item "build-release/Release/thread_scheduler_visualizer.exe" "release_dist/"
        
        & $windeployqt --release --qmldir src/qml "release_dist/thread_scheduler_visualizer.exe"
        
        Compress-Archive -Path "release_dist/*" -DestinationPath "ThreadSchedulerVisualizer-Windows.zip"

    - name: Package Binaries (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p release_dist
        cp build-release/thread_scheduler_visualizer release_dist/
        
        tar -czvf ThreadSchedulerVisualizer-Linux.tar.gz -C release_dist .

    - name: Smoke Test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Start-Process -FilePath "release_dist/thread_scheduler_visualizer.exe" -PassThru -WindowStyle Hidden | Stop-Process
        Write-Host "Windows smoke test passed successfully!"

    - name: Smoke Test (Linux)
      if: runner.os == 'Linux'
      run: |
        ldd build-release/thread_scheduler_visualizer
        echo "Linux smoke test passed successfully!"

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ runner.os }}
        path: |
          ThreadSchedulerVisualizer-Windows.zip
          ThreadSchedulerVisualizer-Linux.tar.gz

  build-and-test-sanitizers:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          g++ \
          qtbase5-dev \
          qtdeclarative5-dev \
          libqt5svg5-dev

    - name: Configure CMake with Sanitizers
      run: |
        cmake -B build-asan -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_SANITIZERS=ON \
          -DBUILD_TESTS=ON \
          -DBUILD_BENCHMARKS=OFF

    - name: Build with ASan & UBSan
      run: cmake --build build-asan --config Debug

    - name: Run Unit Tests under ASan/UBSan
      run: ctest --test-dir build-asan --output-on-failure

  build-and-test-tsan:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          g++ \
          qtbase5-dev \
          qtdeclarative5-dev \
          libqt5svg5-dev

    - name: Configure CMake with ThreadSanitizer
      run: |
        cmake -B build-tsan -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_TSAN=ON \
          -DBUILD_TESTS=ON \
          -DBUILD_BENCHMARKS=OFF

    - name: Build with TSan
      run: cmake --build build-tsan --config Debug

    - name: Run Unit Tests under TSan
      run: ctest --test-dir build-tsan --output-on-failure

  code-coverage:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies & gcovr
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          g++ \
          qtbase5-dev \
          qtdeclarative5-dev \
          libqt5svg5-dev \
          gcovr

    - name: Configure CMake with Coverage
      run: |
        cmake -B build-cov -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_COVERAGE=ON \
          -DBUILD_TESTS=ON \
          -DBUILD_BENCHMARKS=OFF

    - name: Build Project with Coverage
      run: cmake --build build-cov --config Debug

    - name: Run Unit Tests
      run: ctest --test-dir build-cov --output-on-failure

    - name: Generate Coverage Report
      run: |
        gcovr --root . \
          --filter "src/core/" \
          --exclude "tests/" \
          --xml-pretty --output build-cov/coverage.xml \
          --print-summary

  static-analysis:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies & Linters
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          g++ \
          qtbase5-dev \
          qtdeclarative5-dev \
          libqt5svg5-dev \
          cppcheck \
          clang-tidy

    - name: Run Cppcheck
      run: |
        cppcheck --enable=warning,style,performance,portability \
          --std=c++17 \
          --error-exitcode=1 \
          --suppress=missingIncludeSystem \
          --inline-suppr \
          src/ include/

    - name: Configure CMake with Clang-Tidy
      run: |
        cmake -B build-tidy -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DCMAKE_CXX_CLANG_TIDY="clang-tidy;-checks=-*,cppcoreguidelines-*,readability-identifier-naming" \
          -G Ninja

    - name: Build with Clang-Tidy Checks
      run: cmake --build build-tidy --config Debug