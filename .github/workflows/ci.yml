name: C++ Qt 5 CI

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build on Ubuntu (Qt 5)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies & Qt 5
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          g++ \
          qtbase5-dev \
          qtdeclarative5-dev

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=OFF

    - name: Build Project
      run: |
        cmake --build build --config Release