name: C++ Qt 5 CI

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build & Run on Ubuntu (GCC/Ninja)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Qt 5
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            qtbase5-dev \
            qtdeclarative5-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Run Smoke Test Binary
        run: |
          ./build/thread_scheduler_visualizer

  build-windows:
    name: Build on Windows (MSVC)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          network-retries: 5

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Run Smoke Test Binary
        run: |
          .\build\Release\thread_scheduler_visualizer.exe