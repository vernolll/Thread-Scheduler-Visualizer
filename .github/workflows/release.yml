name: Build and Release Binaries

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.1'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake
        shell: pwsh
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build Application
        shell: pwsh
        run: cmake --build build --config Release

      - name: Deploy Qt Dependencies (windeployqt)
        shell: pwsh
        run: |
          & "C:\Qt\6.6.1\msvc2019_64\bin\windeployqt.exe" --qmldir . --release build/Release/thread_scheduler_visualizer.exe

      - name: Archive Windows Build
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/* -DestinationPath thread-scheduler-visualizer-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thread-scheduler-visualizer-windows-x64
          path: thread-scheduler-visualizer-windows-x64.zip

  build-linux:
    name: Build for Linux (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libqt5svg5-dev qtbase5-dev qtdeclarative5-dev libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -G Ninja

      - name: Build Application
        run: cmake --build build --config Release

      - name: Archive Linux Build
        run: |
          tar -czvf thread-scheduler-visualizer-linux-x86_64.tar.gz -C build thread_scheduler_visualizer

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thread-scheduler-visualizer-linux-x86_64
          path: thread-scheduler-visualizer-linux-x86_64.tar.gz